---
name: Test

"on":
  workflow_dispatch: {}
  pull_request: {}
  push: {}

env:
  CLICOLOR: 1

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check-out repository
        uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.4.0
      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e . --group dev --torch-backend cpu
      - name: Run tests
        run: uv run --no-sync pytest -v tests/unit
