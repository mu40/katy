---
name: Lint

"on":
  workflow_dispatch: {}
  pull_request: {}
  push: {}

env:
  CLICOLOR: 1

# One job per hook from `.pre-commit-config.yaml`, so that each shows its own
# result. Unit tests run in their own workflow.
jobs:
  lint:
    name: ${{ matrix.hook }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        hook: [typos, ruff-check, shellcheck, pymarkdown, yamllint]
    steps:
      - name: Check-out repository
        uses: actions/checkout@v6
      - name: Run hook
        uses: j178/prek-action@v3.1.0
        with:
          extra-args: ${{ matrix.hook }} --all-files
