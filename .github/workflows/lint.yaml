---
name: Lint

"on":
  workflow_dispatch: {}
  pull_request: {}
  push: {}

env:
  CLICOLOR: 1

# One job per hook in `.pre-commit-config.yaml`, so each shows its own result.
jobs:
  lint:
    name: ${{ matrix.hook }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        hook:
          - pymarkdown
          - ruff-check
          - typos
          - yamllint
    steps:
      - name: Check-out repository
        uses: actions/checkout@v7
      - name: Run hook
        uses: j178/prek-action@v3.1.1
        with:
          extra-args: --all-files ${{ matrix.hook }}
