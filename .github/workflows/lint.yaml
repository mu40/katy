---
name: Lint

"on":
  workflow_dispatch: {}
  pull_request: {}
  push: {}

env:
  CLICOLOR: 1

# Hooks from `.pre-commit-config.yaml`. Unit tests run in their own workflow.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check-out repository
        uses: actions/checkout@v6
      - name: Run hooks
        uses: j178/prek-action@v3
        with:
          extra-args: --all-files --skip pytest
